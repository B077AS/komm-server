spring.application.name=komm
server.port=8090

# SFU
sfu.signal-port=7880
sfu.media-port=7882
sfu.tcp-port=7881

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# JWT
jwt.access-token.expiration=900
jwt.refresh-token.expiration=2592000
jwt.issuer=komm
jwt.keys.directory=keys
jwt.keys.private=keys/komm-private.pem
jwt.keys.public=keys/komm-public.pem

# Hub-issued TLS certificate (written at activation; enables HTTPS on next boot —
# see TlsEnvironmentPostProcessor). Delete the file to fall back to plain HTTP.
komm.tls.cert-file=keys/tls-cert.pem

# Read once, on first boot with no installation record yet (see StartupValidator);
# deleted after a successful activation. komm-server-launcher's `install-service`
# writes this after prompting for the verification code shown in the Komm client.
komm.setup-token.file=setup-token.txt

# Ports chosen in the Komm client at installation creation, delivered in the
# activation response and written here (see PortConfigService); applied on the next
# boot by PortEnvironmentPostProcessor, overriding server.port/sfu.* below.
komm.ports-file=installation-ports.properties

websocket.url=ws://localhost:8085/ws/installations
api.url=http://localhost:8085

komm.attachments.base-path=uploads/attachments
komm.soundboards.base-path=uploads/soundboards

# How often the background worker purges servers flagged for deletion (milliseconds)
komm.server-purge.interval-ms=30000

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB
server.tomcat.max-http-form-post-size=52MB
server.tomcat.max-swallow-size=52MB

# Permission cache — keyed by (userId:channelId), capped at 2000 entries (~4 MB worst-case)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=60s
