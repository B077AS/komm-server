# Release pipeline for komm-server: the server (repo root) and its `kommserver` tool (launcher/), shipped as a
# self-updating install built with jpack (https://github.com/B077AS/jpack). No Java runtime is bundled: installs run
# on the machine's Java 21+ (systemJava in src/jpack/jpack.json).
#
# Release flow (create a GitHub release with a tag like 0.0.9; a leading "v" is stripped):
#   1. `jars` builds the server jar ONCE (pointed at the production hub) and the launcher jar. Both platform jobs
#      package these same files, so the "app" and "launcher" parts are one file each on the release. The launcher's
#      version is deliberately NOT bumped and its jar is reproducible: it keeps its hash, and installed copies do not
#      download it again, until its code changes.
#   2. `linux` / `windows` run jpack:package for their platform (the stub is native), then wrap the install folder:
#      komm-server-linux-x64.tar.gz (install.sh + uninstall.sh + files/) and Komm-Server-Setup.exe (Inno Setup + WinSW).
#   3. Everything goes on the release: every file of target/jpack/release/ (parts first, the manifest
#      jpack-<platform>.json LAST, since installs read releases/latest/download/ and a manifest must never name a part
#      that is not there yet), the two downloads, and komm-server.jar (stable link for the hub site).
#
# Manual flow (Actions -> Run workflow, tag = an existing release): rebuilds that tag and replaces its assets.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag - rebuilds its assets from that tag and replaces them on the release"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve version from the release tag
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  jars:
    name: Server and launcher jars (built once)
    needs: version
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set version from the tag
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      # The committed defaults point at a local hub for development; the released jar talks to the production hub.
      - name: Point the jar at the production hub
        run: |
          sed -i \
            -e 's|^websocket\.url=.*|websocket.url=wss://kommvoice.com/ws/installations|' \
            -e 's|^api\.url=.*|api.url=https://kommvoice.com|' \
            src/main/resources/application.properties
          grep -E '^(websocket|api)\.url=' src/main/resources/application.properties

      - name: Build the server jar
        run: ./mvnw -B -ntp clean package -DskipTests

      - name: Build the launcher jar
        run: ./mvnw -B -ntp -f launcher/pom.xml clean package

      - uses: actions/upload-artifact@v5
        with:
          name: jars
          path: |
            target/komm-server-${{ needs.version.outputs.version }}.jar
            launcher/target/komm-server-launcher.jar
          if-no-files-found: error

      # Stable name for the hub site's releases/latest/download/komm-server.jar link.
      - name: Upload komm-server.jar
        run: |
          cp "target/komm-server-$VERSION.jar" komm-server.jar
          gh release upload "$TAG" komm-server.jar --clobber -R "$GITHUB_REPOSITORY"

  linux:
    name: Linux (tarball + update files)
    needs: [version, jars]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPLACE_EXISTING: ${{ github.event_name == 'workflow_dispatch' }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/download-artifact@v5
        with:
          name: jars
          path: prebuilt

      - name: Set version from the tag
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      # The goal alone, on the jars built above (nothing is compiled here). jpack.json names the launcher jar at
      # launcher/target/, so the prebuilt one goes there.
      - name: Build the jpack release
        run: |
          mkdir -p launcher/target
          cp prebuilt/launcher/target/komm-server-launcher.jar launcher/target/
          ./mvnw -B -ntp -Pjpack jpack:package "-Djpack.jar=prebuilt/target/komm-server-$VERSION.jar"

      - name: Check the release files
        run: |
          ls -l target/jpack/release
          test -s target/jpack/release/jpack-linux-x64.json
          test -s "target/jpack/release/komm-server-$VERSION.jar"
          test -s target/jpack/release/komm-server-launcher.jar
          grep -q '"runtime": "system"' target/jpack/release/jpack-linux-x64.json

      - name: Build the tarball
        run: |
          STAGE=komm-server-linux-x64
          mkdir -p "$STAGE/files"
          cp -a target/jpack/image/linux-x64/. "$STAGE/files/"
          install -m 755 packaging/linux/install.sh packaging/linux/uninstall.sh "$STAGE/"
          test -x "$STAGE/files/komm-server"
          tar czf komm-server-linux-x64.tar.gz "$STAGE"

      - name: Upload to the release
        run: |
          bash .github/scripts/upload-parts.sh target/jpack/release
          gh release upload "$TAG" komm-server-linux-x64.tar.gz --clobber -R "$GITHUB_REPOSITORY"
          gh release upload "$TAG" target/jpack/release/jpack-linux-x64.json --clobber -R "$GITHUB_REPOSITORY"

  windows:
    name: Windows (installer + update files)
    needs: [version, jars]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      REPLACE_EXISTING: ${{ github.event_name == 'workflow_dispatch' }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/download-artifact@v5
        with:
          name: jars
          path: prebuilt

      - name: Set version from the tag
        run: ./mvnw -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build the jpack release
        run: |
          mkdir -p launcher/target
          cp prebuilt/launcher/target/komm-server-launcher.jar launcher/target/
          ./mvnw -B -ntp -Pjpack jpack:package "-Djpack.jar=prebuilt/target/komm-server-$VERSION.jar"

      - name: Check the release files
        run: |
          ls -l target/jpack/release
          test -s target/jpack/release/jpack-windows-x64.json
          test -s "target/jpack/release/komm-server-$VERSION.jar"
          test -s target/jpack/release/komm-server-launcher.jar
          grep -q '"runtime": "system"' target/jpack/release/jpack-windows-x64.json

      - name: Download WinSW
        run: curl -fsSL -o target/WinSW-x64.exe https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe

      - name: Build the installer
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:VERSION" `
            "/DImageDir=$repo\target\jpack\image\windows-x64" `
            "/DWinSW=$repo\target\WinSW-x64.exe" `
            "/DOutputDir=$repo\target\installer" `
            "$repo\packaging\windows\komm-server.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload to the release
        run: |
          bash .github/scripts/upload-parts.sh target/jpack/release
          gh release upload "$TAG" target/installer/Komm-Server-Setup.exe --clobber -R "$GITHUB_REPOSITORY"
          gh release upload "$TAG" target/jpack/release/jpack-windows-x64.json --clobber -R "$GITHUB_REPOSITORY"
